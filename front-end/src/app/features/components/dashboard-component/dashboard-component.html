<div class="min-h-screen p-6 text-black">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Landlord Dashboard</h1>
      <p class="text-gray-400 mt-2">Manage your listings and add new properties to the platform.</p>
    </header>

    <!-- Quick Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg">
        <h3 class="text-sm font-medium text-gray-400">Total Property</h3>
        <p class="text-3xl font-bold mt-1">0</p>
      </div>
      <div class="p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg">
        <h3 class="text-sm font-medium text-gray-400">Occupied</h3>
        <p class="text-3xl font-bold mt-1">0</p>
      </div>
      <div class="p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg">
        <h3 class="text-sm font-medium text-gray-400">Available</h3>
        <p class="text-3xl font-bold mt-1">0</p>
      </div>
    </div>

    <!-- Add Property Form Section -->
    <div class="bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 p-8 shadow-xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="p-2 bg-blue-500/20 rounded-lg">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-blue-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </div>
        <h2 class="text-xl font-semibold">Add New Property</h2>
      </div>

      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-200 mb-1">Property Name</label>
            <input
              type="text"
              class="w-full px-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder:text-gray-500"
              placeholder="e.g. Stanza Residence"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-200 mb-1">Category</label>
            <select
              class="w-full px-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
            >
              <option class="bg-gray-900" value="Dorm">Dormitory</option>
              <option class="bg-gray-900" value="Apartment">Apartment</option>
              <option class="bg-gray-900" value="Studio">Studio Unit</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-200 mb-1">Full Address</label>
          <input
            type="text"
            class="w-full px-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder:text-gray-500"
            placeholder="123 Street Name, City, Province"
          />
        </div>

        <div class="w-full md:w-1/2">
          <label class="block text-sm font-medium text-gray-200 mb-1">Monthly Rent (₱)</label>
          <input
            type="number"
            class="w-full px-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder:text-gray-500"
            placeholder="0.00"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-200 mb-3">Amenities Included</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <label class="flex items-center gap-2 cursor-pointer group">
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-white/20 bg-white/5 text-blue-600 focus:ring-blue-500 focus:ring-offset-0"
              />
              <span class="text-sm text-gray-300 group-hover:text-white transition-colors"
                >Electricity</span
              >
            </label>
            <label class="flex items-center gap-2 cursor-pointer group">
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-white/20 bg-white/5 text-blue-600 focus:ring-blue-500 focus:ring-offset-0"
              />
              <span class="text-sm text-gray-300 group-hover:text-white transition-colors"
                >Water</span
              >
            </label>
            <label class="flex items-center gap-2 cursor-pointer group">
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-white/20 bg-white/5 text-blue-600 focus:ring-blue-500 focus:ring-offset-0"
              />
              <span class="text-sm text-gray-300 group-hover:text-white transition-colors"
                >Internet</span
              >
            </label>
            <label class="flex items-center gap-2 cursor-pointer group">
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-white/20 bg-white/5 text-blue-600 focus:ring-blue-500 focus:ring-offset-0"
              />
              <span class="text-sm text-gray-300 group-hover:text-white transition-colors"
                >Aircon</span
              >
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-200 mb-2">Property Images</label>
          <div
            class="border-2 border-dashed border-white/10 rounded-xl p-10 text-center hover:border-blue-500/50 hover:bg-blue-500/5 transition-all cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10 text-gray-500 mx-auto mb-2"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <p class="text-sm text-gray-400 font-medium">Click to upload or drag and drop</p>
            <p class="text-xs text-gray-500 mt-1">PNG, JPG up to 10MB</p>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-4 mt-4 bg-white text-blue-900 font-extrabold rounded-xl hover:bg-blue-50 active:scale-[0.98] transition-all shadow-lg text-lg uppercase tracking-wider"
        >
          Publish Property
        </button>
      </form>
    </div>
  </div>
</div>
