<div class="min-h-screen p-6 text-white">
  <div class="max-w-2xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Profile Settings</h1>
      <p class="text-gray-400 mt-2">Manage your personal information and account security.</p>
    </header>

    <div class="space-y-6">
      <!-- Personal Information Section -->
      <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-xl">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-blue-500/20 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-blue-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
          <h2 class="text-xl font-semibold">Personal Information</h2>
        </div>

        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300">Full Name</label>
            <input
              type="text"
              class="w-full mt-1 px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="John Doe"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300">Contact Number</label>
            <input
              type="tel"
              class="w-full mt-1 px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="+63 912 345 6789"
            />
          </div>

          <button
            type="submit"
            class="w-full py-3 px-4 mt-2 bg-white text-blue-900 font-bold rounded-lg hover:bg-gray-200 transition-all shadow-lg active:scale-[0.98]"
          >
            Update Profile
          </button>
        </form>
      </div>

      <!-- Email Settings Section -->
      <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-xl">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-green-500/20 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-green-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
          </div>
          <h2 class="text-xl font-semibold">Change Email</h2>
        </div>

        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300">New Email Address</label>
            <input
              type="email"
              class="w-full mt-1 px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="new-email@example.com"
            />
          </div>
          <p class="text-xs text-gray-400">
            A confirmation link will be sent to your new email address for verification.
          </p>

          <button
            type="submit"
            class="w-full py-3 px-4 bg-white text-blue-900 font-bold rounded-lg hover:bg-gray-200 transition-all shadow-lg active:scale-[0.98]"
          >
            Update Email
          </button>
        </form>
      </div>

      <!-- Password Settings Section -->
      <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-xl">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-red-500/20 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-red-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>
          <h2 class="text-xl font-semibold">Security & Password</h2>
        </div>

        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300">New Password</label>
            <input
              type="password"
              class="w-full mt-1 px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
              placeholder="••••••••"
            />
          </div>

          <button
            type="submit"
            class="w-full py-3 px-4 bg-white text-blue-900 font-bold rounded-lg hover:bg-gray-200 transition-all shadow-lg active:scale-[0.98]"
          >
            Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
